<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Social links profile</title>
  <style>
    @font-face {
      font-family: 'Inter';
      src: url('./assets/fonts/Inter-VariableFont_slnt_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      background-color: hsl(0, 0%, 8%);
      color: hsl(0, 0%, 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background-color: hsl(0, 0%, 12%);
      border-radius: 12px;
      padding: 40px;
      max-width: 384px;
      width: 100%;
      text-align: center;
    }

    .card__avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
    }

    .card__name {
      font-size: 24px;
      font-weight: 600;
      margin-top: 24px;
      letter-spacing: -0.2px;
    }

    .card__location {
      color: hsl(75, 94%, 57%);
      font-weight: 700;
      font-size: 14px;
      margin-top: 8px;
    }

    .card__bio {
      margin-top: 24px;
      font-weight: 400;
      line-height: 1.5;
    }

    .card__links {
      list-style: none;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card__link {
      display: block;
      background-color: hsl(0, 0%, 20%);
      color: hsl(0, 0%, 100%);
      text-decoration: none;
      font-weight: 600;
      padding: 12px;
      border-radius: 8px;
      transition: background-color 0.2s, color 0.2s;
    }

    .card__link:hover,
    .card__link:focus-visible {
      background-color: hsl(75, 94%, 57%);
      color: hsl(0, 0%, 8%);
    }

    .attribution {
      font-size: 11px;
      text-align: center;
      margin-top: 16px;
      color: hsl(0, 0%, 50%);
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>
<body>

  <main class="card">
    <img class="card__avatar" src="./assets/images/avatar-jessica.jpeg" alt="Jessica Randall">

    <h1 class="card__name">Jessica Randall</h1>
    <p class="card__location">London, United Kingdom</p>
    <p class="card__bio">"Front-end developer and avid reader."</p>

    <ul class="card__links">
      <li><a class="card__link" href="#">GitHub</a></li>
      <li><a class="card__link" href="#">Frontend Mentor</a></li>
      <li><a class="card__link" href="#">LinkedIn</a></li>
      <li><a class="card__link" href="#">Twitter</a></li>
      <li><a class="card__link" href="#">Instagram</a></li>
    </ul>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>

</body>
</html>

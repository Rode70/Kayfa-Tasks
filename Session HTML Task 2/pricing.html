<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricing</title>
</head>
<body>

  <h1>Pricing</h1>

  <table border="1">
    <caption>Kayfa Academy subscription plans for 2026</caption>

    <thead>
      <tr>
        <th scope="col" rowspan="2">Plan</th>
        <th scope="colgroup" colspan="2">Price (USD)</th>
        <th scope="col" rowspan="2">Students per class</th>
      </tr>
      <tr>
        <th scope="col">Monthly</th>
        <th scope="col">Yearly</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <th scope="row">Basic</th>
        <td>19</td>
        <td>190</td>
        <td>40</td>
      </tr>
      <tr>
        <th scope="row">Pro</th>
        <td>39</td>
        <td>390</td>
        <td>20</td>
      </tr>
      <tr>
        <th scope="row">Team</th>
        <td>89</td>
        <td>890</td>
        <td>8</td>
      </tr>
    </tbody>

  </table>

</body>
</html>
